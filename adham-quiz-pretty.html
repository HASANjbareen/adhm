<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>اختبار: هل بتعرف أدهم؟</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <!-- خط عربي لطيف -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #f9fafb;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(168, 85, 247, 0.25), transparent 60%),
        radial-gradient(1000px 700px at 80% 20%, rgba(34, 197, 94, 0.18), transparent 55%),
        radial-gradient(900px 600px at 50% 90%, rgba(59, 130, 246, 0.18), transparent 55%),
        linear-gradient(180deg, #0b1020, #050816);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(2, 6, 23, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.20);
      border-radius: 20px;
      padding: 22px 18px 18px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: radial-gradient(600px 200px at 50% 0%, rgba(255,255,255,0.10), transparent 60%);
      pointer-events: none;
    }

    .top {
      display: grid;
      gap: 8px;
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .2px;
      font-weight: 800;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: rgba(229, 231, 235, 0.8);
      line-height: 1.6;
    }

    .progress {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.95);
      text-align: left;
      direction: ltr;
    }

    .question-box {
      margin-top: 10px;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 14px 12px;
    }

    .question {
      margin: 0;
      font-size: 16px;
      line-height: 1.8;
      color: #f3f4f6;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 12px 0;
      border-radius: 999px;
      border: 0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:active { transform: scale(0.98); }

    .true {
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color: #052e16;
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.28);
    }
    .false {
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: #450a0a;
      box-shadow: 0 12px 24px rgba(239, 68, 68, 0.28);
    }

    .true:hover, .false:hover { filter: brightness(1.05); }

    /* نافذة النتيجة */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .modal {
      width: min(520px, 92vw);
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      padding: 18px 16px 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      text-align: center;
    }

    .modal h2 {
      margin: 4px 0 10px;
      font-size: 18px;
      font-weight: 800;
    }

    .modal p {
      margin: 0 0 14px;
      font-size: 15px;
      line-height: 1.9;
      color: rgba(243, 244, 246, 0.95);
      white-space: pre-line;
    }

    .modal .close {
      width: 100%;
      background: rgba(148, 163, 184, 0.18);
      color: #f9fafb;
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: none;
      padding: 11px 0;
    }

    .modal .close:hover { filter: brightness(1.08); }

    @media (max-width: 420px) {
      h1 { font-size: 18px; }
      .question { font-size: 15px; }
      .buttons { grid-template-columns: 1fr; }
      .progress { text-align: center; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <h1>اختبار: هل بتعرف أدهم؟ 😏</h1>
      <p class="subtitle">جاوب صح على كل الأسئلة عشان توصل للرسالة الأخيرة 👀</p>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question-box">
      <p class="question" id="question"></p>
    </div>

    <div class="buttons">
      <button class="true" onclick="answer('صح')">صح ✅</button>
      <button class="false" onclick="answer('غلط')">غلط ❌</button>
    </div>
  </div>

  <!-- Overlay Modal بدل alert -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modal-title">رسالة</h2>
      <p id="modal-text"></p>
      <button class="close" onclick="closeModal()">تمام</button>
    </div>
  </div>

  <script>
    const questions = [
      { text: "هل لون أدهم المفضل برتقالي؟", correct: "صح" },
      { text: "هل أكلة أدهم المفضلة الدجاج؟", correct: "غلط" },
      { text: "هل دولة أدهم المفضلة للسفر هي تركيا؟", correct: "صح" },
      { text: "هل سورة أدهم المفضلة في القرآن هي الرحمن؟", correct: "غلط" },
      { text: "هل تاريخ ميلاد أدهم هو 2/9؟", correct: "صح" }
    ];

    let index = 0;
    const questionEl = document.getElementById("question");
    const progressEl = document.getElementById("progress");

    const overlay = document.getElementById("overlay");
    const modalTitle = document.getElementById("modal-title");
    const modalText = document.getElementById("modal-text");

    function showQuestion() {
      questionEl.textContent = questions[index].text;
      progressEl.textContent = `السؤال ${index + 1} من ${questions.length}`;
    }

    function resetQuiz() {
      index = 0;
      showQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(title, text) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      overlay.style.display = "grid";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeModal() {
      overlay.style.display = "none";
    }

    function answer(userAnswer) {
      if (userAnswer === questions[index].correct) {
        index++;
        if (index === questions.length) {
          openModal("مبرووك! 😍", "أنا بحبك ❤️");
          resetQuiz();
        } else {
          showQuestion();
        }
      } else {
        openModal("غلط 😈", "ما توقعت انك هبيله هيك خذ 🖕🏻");
        resetQuiz();
      }
    }

    showQuestion();
  </script>
</body>
</html>
